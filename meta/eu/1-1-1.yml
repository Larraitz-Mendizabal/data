SDG_GOAL: >-
  Meta 1: Poner fin a la pobreza en todas sus formas y en todo el mundo
SDG_TARGET: >-
  Objetivo 1.1: De aquí a 2030, erradicar para todas las personas y en todo
  el mundo la pobreza extrema (actualmente se considera que sufren pobreza
  extrema las personas que viven con menos de 1,25 dólares de los Estados Unidos
  al día)
